<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Indicators | Macro Trade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0e14; color: #e1e4e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .table { color: #e1e4e8; font-size: 0.9rem; }
        .table-dark { background-color: #161b22; }
        .navbar { border-bottom: 1px solid #30363d; background-color: #161b22 !important; }
        .nav-link { color: #8b949e !important; }
        .nav-link.active { color: #e1e4e8 !important; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark px-3 py-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-6" href="/">MACRO TRADE</a>
            <span class="badge bg-success ms-2">LIVE</span>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav mt-2 mt-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Market Feeds</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/indicators">Macro Indicators</a></li>
                    <li class="nav-item"><a class="nav-link" href="/signals">Trade Signals</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-3 my-4">
        <h5 class="fw-semibold text-light mb-3">Fundamental Macro Series</h5>
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle mb-0 text-nowrap">
                    <thead>
                        <tr class="text-secondary small">
                            <th>SERIES ID</th>
                            <th>INDICATOR NAME</th>
                            <th>CATEGORY</th>
                            <th>FREQUENCY</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for ind in indicators %}
                        <tr>
                            <td class="fw-bold text-light">{{ ind.series_id }}</td>
                            <td>{{ ind.name }}</td>
                            <td><span class="badge bg-secondary">{{ ind.category }}</span></td>
                            <td class="text-muted small">{{ ind.frequency }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">No indicators found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
